<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Coral flame gradient -->
    <linearGradient id="letgooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#E8431F" />
    </linearGradient>
    <!-- Shadow for plane -->
    <filter id="planeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#letgooGrad)" />

  <!-- Bold white paper plane pointing 45deg top-right -->
  <g filter="url(#planeShadow)">
    <!-- Main Right Wing (Pure bright white) -->
    <polygon points="50,14 18,36 33,40 50,14" fill="#FFFFFF" />
    
    <!-- Left Wing (Slightly warm off-white for 3D depth) -->
    <polygon points="50,14 33,40 40,49 50,14" fill="#FFF1EE" />
    
    <!-- Under Fold Shadow -->
    <polygon points="33,40 37,45 35,41" fill="#E8431F" opacity="0.6" />
    
    <!-- Central Fold Spine -->
    <polyline points="50,14 33,40" stroke="#FFEBE6" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Little energy sparkle star at top left of plane -->
  <path d="M19,17 L20.5,21.5 L25,23 L20.5,24.5 L19,29 L17.5,24.5 L13,23 L17.5,21.5 Z" fill="#FFE58F" />
  
  <!-- Speed trail dot -->
  <circle cx="21" cy="47" r="2.5" fill="#FFEBE6" opacity="0.9" />
  <circle cx="15" cy="51" r="1.8" fill="#FFEBE6" opacity="0.6" />
</svg>
