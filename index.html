<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đi Thôi — Biến câu "mai mốt đi" thành hành động thật</title>
  <meta name="description" content="Ứng dụng quản lý lịch đi chơi, ăn uống, du lịch. Quản lý vòng đời Muốn đi → Đã lên lịch → Đã đi." />

  <!-- Google Font: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN with Custom Theme Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif']
          },
          colors: {
            brand: {
              base: '#FAF7F2',
              coral: '#FF6B4A',
              coralHover: '#E85736',
              coralLight: '#FFEBE6',
              text: '#2B2B2B',
              muted: '#736E66',
              darkBg: '#141210',
              darkSurface: '#1F1C19'
            }
          },
          borderRadius: {
            '2xl': '16px',
            '3xl': '24px'
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS for Interactive & Mini Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Custom Stylesheets & Tokens -->
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/app.css" />
</head>
<body class="min-h-screen bg-[var(--color-bg-base)] text-[var(--color-text-main)] antialiased selection:bg-[#FFEBE6] selection:text-[#FF6B4A]">
  <!-- APP ROOT CONTAINER -->
  <div id="app" class="w-full min-h-screen">
    <!-- Rendered dynamically by src/app.js -->
    <div class="h-screen w-full flex items-center justify-center">
      <div class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 rounded-full border-4 border-[#FF6B4A] border-t-transparent animate-spin"></div>
        <p class="text-sm font-semibold text-[var(--color-text-muted)]">Đang mở Đi Thôi...</p>
      </div>
    </div>
  </div>

  <!-- Main JavaScript Application Module -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
